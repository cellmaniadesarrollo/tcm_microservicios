root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  # Compila la aplicación ubicada en ./cmd/scraper hacia el binario temporal
  cmd = "go build -o ./tmp/main ./cmd/scraper"
  # Binario que Air ejecutará
  bin = "tmp/main"
  # Extensiones de archivo que activan la recompilación al cambiar
  include_ext = ["go", "tpl", "tmpl", "html"]
  # Directorios excluidos de la vigilancia para no saturar CPU ni bucles de compilación
  exclude_dir = ["assets", "tmp", "vendor", "testdata"]
  # Retardo en milisegundos antes de recompilar (evita múltiples compilaciones si guardas rápido)
  delay = 500
  # Detiene la ejecución previa si hay errores de compilación
  stop_on_error = true
  # Habilita el modo de monitoreo por sondeo (polling), necesario en sistemas de archivos sobre volúmenes Docker
  poll = true
  poll_interval = 500

[log]
  time = false

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true