x-node-health: &node-health
  test: ["CMD", "node", "-e", "require('http').get('http://localhost:3030/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 40s

services:
  inventario:
    build:
      context: ../../microservices/inventario
      dockerfile: Dockerfile.dev
    container_name: ms-inventario
    restart: always
    ports:
      - "3030:3030"
      - "3016:3005"
    volumes:
      - ../../microservices/inventario:/app
      - /app/node_modules
    command: ["npm", "run", "start:dev"]
    env_file:
      - ../.env
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=${PORT:-3030}
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - LEGACY_JWT_SECRET=${LEGACY_JWT_SECRET}
      
      # ✅ CONEXIÓN 1: PRODUCTOS (default) - MongoDB local
      - MONGODB_URI=${MONGODB_URI}
      
      # ✅ CONEXIÓN 2: INCOMES (atlas) - MongoDB Atlas
      - MONGODB_ATLAS_URI=${MONGODB_ATLAS_URI}
      
      # ✅ NOMBRES DE BASE DE DATOS
      - DB_NAME_INVENTARIO=${DB_NAME_INVENTARIO}
      - DB_NAME_ATLAS=${DB_NAME_ATLAS}
      
      - REDIS_HOST=${REDIS_HOST:-redis-realtime}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DB=${REDIS_DB:-0}
      - RABBITMQ_URL=${RABBITMQ_URL}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-1h}
      - ORDER_SERVICE_URL=${ORDER_SERVICE_URL:-http://orders:3001}
      - NOTIFICATION_SERVICE_URL=${NOTIFICATION_SERVICE_URL:-http://notifications:3010}
      - USER_SERVICE_URL=${USER_SERVICE_URL:-http://users:3001}
      - PRODUCT_SERVICE_URL=${PRODUCT_SERVICE_URL:-http://products:3020}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:4200}
      - LOG_LEVEL=${LOG_LEVEL:-debug}
      - SERVICE_NAME=${SERVICE_NAME:-INVENTARIO_SERVICE}
      - SERVICE_PORT=${SERVICE_PORT:-3030}
      - SERVICE_RPC_PORT=${SERVICE_RPC_PORT:-3005}
      - CHOKIDAR_USEPOLLING=${CHOKIDAR_USEPOLLING:-true}
      - CHOKIDAR_INTERVAL=${CHOKIDAR_INTERVAL:-100}
      - INCOME_BACKEND_URL=${INCOME_BACKEND_URL}
      - INVENTORY_BACKEND_URL=${INVENTORY_BACKEND_URL}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - backend
    healthcheck: *node-health

networks:
  backend:
    external: true
    name: backend