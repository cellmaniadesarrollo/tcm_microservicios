name: Sync compose to EC2

on:
  push:
    branches: [ main ]
    paths:
      - 'docker/compose.prod.yml'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copiar compose.prod.yml a la EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: ${{ secrets.EC2_PORT }}
          source: docker/compose.prod.yml
          target: /home/ubuntu/proyects/tcm_microservicios/docker
          strip_components: 1
          overwrite: true

      - name: Validar sintaxis del compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: ${{ secrets.EC2_PORT }}
          script: |
            cd /home/ubuntu/proyects/tcm_microservicios/docker || exit 1
            docker compose -f compose.prod.yml config -q
            echo "✅ compose.prod.yml copiado y válido."